name: Leak Guard

# Fails the build if any committed pack under examples/ leaks private data:
# visibility: private, or non-null internal_references. (PRD FR12)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  leak-guard:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install PyYAML
      run: python -m pip install --upgrade pip PyYAML

    - name: Check public packs for leaked private data
      run: python scripts/check_public_packs.py
